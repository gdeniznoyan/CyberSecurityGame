<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cybersecurity Architecture Builder</title><link rel="stylesheet" href="./css/style.css"></head><body>
<header class="site-header"><h1>Cybersecurity Architecture Builder</h1><p>Drag the components from the toolbox into the compatible architecture slots.</p></header><main class="app-shell">
<section class="workspace" aria-labelledby="architecture-title"><h2 id="architecture-title">Architecture Canvas</h2><div id="architecture-canvas" class="architecture-canvas"></div><p id="error-message" class="error-message" role="alert" aria-live="assertive"></p></section>
<section class="toolbox" aria-labelledby="toolbox-title"><h2 id="toolbox-title">Components</h2><div id="component-toolbox" class="toolbox-groups"></div></section>
<section class="actions" aria-label="Architecture actions"><button id="analyze-button">Analyze Architecture</button><button id="export-button">Export Current State</button><button id="import-button">Import State</button><button id="reset-button" class="secondary">Reset Architecture</button></section>
<section id="result-panel" class="result-panel" aria-labelledby="result-title" aria-live="polite"><h2 id="result-title">Future Result</h2><p id="result-initial-message">Architecture analysis will be added later.</p><div id="result-description" hidden></div><div id="result-enabled-features" hidden></div><div id="result-risks" hidden></div><div id="result-recommendation" hidden></div></section></main>
<dialog id="state-dialog"><form method="dialog" class="dialog-card"><div class="dialog-heading"><h2 id="dialog-title">Architecture State</h2><button value="cancel" aria-label="Close dialog">×</button></div><p id="dialog-help"></p><textarea id="state-json" rows="16" spellcheck="false" aria-label="Architecture state JSON"></textarea><p id="dialog-error" class="error-message" role="alert" aria-live="assertive"></p><div class="dialog-actions"><button id="copy-json-button" type="button">Copy JSON</button><button id="apply-import-button" type="button">Import JSON</button><button value="cancel">Close</button></div></form></dialog><script type="module" src="./dist/main.js"></script></body></html>
